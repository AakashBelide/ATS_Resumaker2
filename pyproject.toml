[project]
name = "resumaker"
version = "0.1.0"
description = "Grounded, ATS-optimized resume + cover-letter tailoring from a job-description URL."
readme = "README.md"
requires-python = ">=3.13"

# Core library dependencies. Kept lean: web/scrape-heavy/dev deps live in extras so a
# minimal `uv sync` (or a slim runtime image) stays small.
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "python-docx>=1.2.0",
    "pypdf>=6.15.0",
    "pdfplumber>=0.11.10",
    "pyspellchecker>=0.9.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "curl-cffi>=0.16.0",
    "rich>=15.0.0",
    # LLM providers (provider-agnostic registry): Anthropic API + Google Gemini.
    # The Claude CLI provider shells out to the `claude` binary and needs no SDK.
    "anthropic>=0.40.0",
    "google-genai>=2.17.0",
    "libsql-experimental>=0.0.55",
]

[project.optional-dependencies]
# The FastAPI service + in-process scheduler (R5, RI.3). Not needed for library/CLI use.
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "apscheduler>=3.10.4",
]
# Playwright fallback scraper (R3). Heavy (bundled browsers) so opt-in.
scrape = [
    "playwright>=1.62.0",
]
# NOTE: a headless/stealth tier (for Tesla/Meta/Qualcomm/Google - bot-protected custom
# career sites) was evaluated with Scrapling and deliberately NOT included: it pins an
# older playwright (conflicts with our `scrape` extra), needs a heavy camoufox/patchright
# browser stack, and per research still needs a residential IP to clear Akamai/DataDome.
# It fights the lightweight/self-hostable goal for ~5 companies. If you want that tier,
# run it out-of-band on your own machine; see docs/JOB_INGESTION_RESEARCH.md.
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distributable library. `apps/` (api + cli) are deploy entrypoints run from the
# repo root (`uv run uvicorn apps.api.main:app`, `uv run python -m apps.cli`), not shipped
# as an importable library, so they are intentionally not packaged here.
packages = ["src/resumaker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "UP042",  # keep `str, Enum` (not StrEnum) for pydantic serialization parity
    "B905",   # zip() strict= is pedantic; legacy stages rely on default truncation
]

# Modules ported verbatim from the validated POCs. We intentionally do NOT restyle
# their bodies (semicolon-grouped render calls, tight loops) - reformatting parity-
# critical logic risks silent behavior changes. New code is held to the full ruleset.
[tool.ruff.lint.per-file-ignores]
"src/resumaker/stages/resume/render_docx.py" = ["E702"]
"src/resumaker/stages/resume/generate.py" = ["E702"]
"src/resumaker/ats/verify.py" = ["E702"]
"src/resumaker/stages/sponsorship/scorer.py" = ["B023"]
"src/resumaker/stages/gap.py" = ["SIM102"]
"src/resumaker/stages/location.py" = ["SIM102"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# The infrastructure (config/providers/persistence/pipeline/observability/domain) is
# strictly typed. The `stages`/`ats` modules were ported verbatim from the POCs and are
# verified at runtime by the eval suite; we keep name/import checking on them but relax
# the dynamic-typing complaints (python-docx int/enum, SDK unions) rather than retro-
# annotate parity-critical bodies.
[[tool.mypy.overrides]]
module = ["resumaker.stages.*", "resumaker.ats.*"]
disable_error_code = ["assignment", "arg-type", "operator", "misc",
                      "var-annotated", "union-attr", "index", "call-overload"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real network/LLM providers (skipped by default; run with -m live)",
]
addopts = "-ra -m 'not live'"
