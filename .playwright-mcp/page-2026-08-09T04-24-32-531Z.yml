      - generic [ref=f41e100]:
        - heading "Senior Data Engineering Manager" [level=1] [ref=f41e101]
        - paragraph [ref=f41e102]: Analytics & Data Science | Bengaluru, India | Remote, Remote |
        - link "Apply for this job" [ref=f41e103] [cursor=pointer]:
          - /url: https://careers-apac-atlassian.icims.com/jobs/25165/senior-data-engineering-manager/job?mode=apply
        - separator [ref=f41e104]
      - generic [ref=f41e105]:
        - paragraph [ref=f41e106]:
          - strong [ref=f41e107]: Working at Atlassian
        - paragraph [ref=f41e108]: Atlassians can choose where they work – whether in an office, from home, or a combination of the two. That way, Atlassians have more control over supporting their family, personal goals, and other priorities. We can hire people in any country where we have a legal entity.
        - paragraph [ref=f41e109]: Data is central to everything at Atlassian. We ingest billions of events each month into our analytics platform, and dozens of teams across the company rely on it to drive critical decisions. Our team also builds and manages Atlassian's analytical and operational data store enabling teams to make informed decisions and run their operations on trusted data and services. We're looking for a Senior Data Engineering Manager to join our growing GTM Data Engineering team within the Data Engineering department. Join us as we further democratize data and build exceptional data products for the company.
        - paragraph
        - paragraph [ref=f41e110]:
          - strong [ref=f41e111]: In this role you will get to...
        - list [ref=f41e112]:
          - listitem [ref=f41e113]:
            - paragraph [ref=f41e114]: Build and lead a team of data engineers through hiring, coaching, mentoring, and hands-on career development
          - listitem [ref=f41e115]:
            - paragraph [ref=f41e116]: Provide deep technical guidance across multiple facets of data engineering within a scalable ecosystem
          - listitem [ref=f41e117]:
            - paragraph [ref=f41e118]: Champion engineering excellence by driving cultural and process improvements that elevate quality and efficiency
          - listitem [ref=f41e119]:
            - paragraph [ref=f41e120]: Partner closely with counterparts in other departments as part of a cross-functional team, and foster that collaborative culture within your own team
        - paragraph [ref=f41e121]:
          - strong [ref=f41e122]: More about you...
        - list [ref=f41e123]:
          - listitem [ref=f41e124]:
            - paragraph [ref=f41e125]: You have stellar people management skills and experience leading an agile software team
          - listitem [ref=f41e126]:
            - paragraph [ref=f41e127]: You thrive when developing phenomenal people, not just great products
          - listitem [ref=f41e128]:
            - paragraph [ref=f41e129]: You have worked closely with Data Science, Analytics, and Platform teams
          - listitem [ref=f41e130]:
            - paragraph [ref=f41e131]: You bring expertise in building and maintaining high-quality data components and services
          - listitem [ref=f41e132]:
            - paragraph [ref=f41e133]: You are able to drive technical excellence, pushing for innovation and quality
          - listitem [ref=f41e134]:
            - paragraph [ref=f41e135]: You have at least 6–8 years of experience in a software development role as an individual contributor
          - listitem [ref=f41e136]:
            - paragraph [ref=f41e137]: You have 4+ years of people management experience
          - listitem [ref=f41e138]:
            - paragraph [ref=f41e139]: You have a deep understanding of data challenges at scale and the broader data ecosystem
          - listitem [ref=f41e140]:
            - paragraph [ref=f41e141]: You have experience with solution architecture using public cloud offerings such as AWS, S3, Databricks, Spark/Spark Streaming, graph databases, dbt, or a similar stack
          - listitem [ref=f41e142]:
            - paragraph [ref=f41e143]: You have experience with enterprise data architectural standards and methodologies
          - listitem [ref=f41e144]:
            - paragraph [ref=f41e145]: You have experience with test automation and continuous delivery
          - listitem [ref=f41e146]:
            - paragraph [ref=f41e147]: You hold a graduate degree in Computer Science or a similar discipline
          - listitem [ref=f41e148]:
            - paragraph [ref=f41e149]: You have proficiency in at least one programming language such as Python, and strong command of SQL
        - paragraph [ref=f41e150]:
          - strong [ref=f41e151]: It's great, but not required, if you have...
        - list [ref=f41e152]:
          - listitem [ref=f41e153]:
            - paragraph [ref=f41e154]: Experience building RESTful APIs and microservices
          - listitem [ref=f41e155]:
            - paragraph [ref=f41e156]: Experience with Tableau and Tableau administration
          - listitem [ref=f41e157]:
            - paragraph [ref=f41e158]: Experience with Machine Learning
          - listitem [ref=f41e159]:
            - paragraph [ref=f41e160]: Contributions to open-source projects
        - paragraph [ref=f41e161]:
          - strong [ref=f41e162]: Benefits & Perks
        - paragraph [ref=f41e163]:
          - text: Atlassian offers a wide range of perks and benefits designed to support you, your family and to help you engage with your local community. Our offerings include health and wellbeing resources, paid volunteer days, and so much more. To learn more, visit
          - link [ref=f41e164] [cursor=pointer]:
            - /url: http://go.atlassian.com/perksandbenefits
            - strong [ref=f41e165]: go.atlassian.com/perksandbenefits
          - strong [ref=f41e166]: .
        - paragraph [ref=f41e167]:
          - strong [ref=f41e168]: About Atlassian
        - paragraph [ref=f41e169]: "At Atlassian, we're motivated by a common goal: to unleash the potential of every team. Our software products help teams all over the planet and our solutions are designed for all types of work. Team collaboration through our tools makes what may be impossible alone, possible together."
        - paragraph [ref=f41e170]: We believe that the unique contributions of all Atlassians create our success. To ensure that our products and culture continue to incorporate everyone's perspectives and experience, we never discriminate based on race, religion, national origin, gender identity or expression, sexual orientation, age, or marital, veteran, or disability status. All your information will be kept confidential according to EEO guidelines.
        - paragraph [ref=f41e171]: To provide you the best experience, we can support with accommodations or adjustments at any stage of the recruitment process. Simply inform our Recruitment team during your conversation with them.
        - paragraph [ref=f41e172]:
          - text: To learn more about our culture and hiring process, visit
          - link [ref=f41e173] [cursor=pointer]:
            - /url: http://go.atlassian.com/crh
            - strong [ref=f41e174]: go.atlassian.com/crh
          - strong [ref=f41e175]: .
