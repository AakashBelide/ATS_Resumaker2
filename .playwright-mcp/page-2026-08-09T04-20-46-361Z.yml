        - generic [ref=f4e240]:
          - generic [ref=f4e241]:
            - paragraph [ref=f4e242]: It is unlawful in Massachusetts to require or administer a lie detector test as a condition of employment or continued employment. An employer who violates this law shall be subject to criminal penalties and civil liability.
            - paragraph [ref=f4e243]: Please be aware there are instances of identity thieves posting Takeda-branded jobs and posing as employees in an attempt to steal personal information from job seekers. They visit job-related websites and invite candidates to online chats. During the chat, they press job seekers to provide bank account information and personal identification numbers. If you receive unexpected offers of employment from people claiming to work for Takeda, we suggest you do not correspond with them. Do not click any hyperlinks and do not open any attachments.
            - paragraph [ref=f4e244]: At Takeda, we do not ask for personal financial information during telephone, in-person or video interviews nor do we charge job seekers fees as part of the recruitment process. Takeda's recruiting correspondence will be sent by a recruiting representative with @takeda.com email address — not @gmail.com, @yahoo.com, @hotmail.com or any other email domain service.
            - paragraph [ref=f4e245]:
              - text: "We are investigating ways to mitigate or stop this scheme. If you have concerns related to this issue, consider the following actions: 1) If in the U.S., place a freeze on your credit reports:"
              - link "https://www.consumer.ftc.gov/articles/0497-credit-freeze-faqs" [ref=f4e246] [cursor=pointer]:
                - /url: https://www.consumer.ftc.gov/articles/0497-credit-freeze-faqs
              - text: "; 2) file a complaint with the U.S. Federal Trade Commission:"
              - link "https://reportfraud.ftc.gov/" [ref=f4e247] [cursor=pointer]:
                - /url: https://reportfraud.ftc.gov/
              - text: ; and/or 3) file a report with your local law enforcement agency immediately.
          - paragraph [ref=f4e248]: Copyright 1995-2026 Takeda Pharmaceutical Company Limited. All rights reserved.
